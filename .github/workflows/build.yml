name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --onefile --windowed --name webola --hidden-import pony.orm.dbproviders.sqlite webola.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webola-${{ matrix.os }}
          path: |
            dist/webola
            dist/webola.exe
          if-no-files-found: ignore
